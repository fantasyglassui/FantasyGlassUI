<style>
@font-face { font-family: "Marcellus FG"; src: url(data:font/woff2;base64,@@FONT@@) format("woff2"); font-display: swap; }
:root {
  /* the site's tokens (site/base.css), dark and light; the older names below are kept for this page's rules */
  --ground: #12141a; --card: #181b22; --shot: #1c2029; --raised: #1e222b; --rule: #22262f; --line: #2c313c; --edge: #6b7287;
  --text: #e7e9f4; --dim: #a4abc7; --faint: #8a91b0; --gold: #f0c66b; --on-gold: #14110a; --frost: #8fd3ff; --focus: #ffffff; --danger: #e2574c;
  --ink: var(--ground); --ink-2: var(--card); --ink-3: var(--raised);
  --display: "Marcellus FG", Georgia, serif;
  --body: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #f4f5f8; --card: #ffffff; --shot: #e3e6ed; --raised: #ffffff; --rule: #dde0e7; --line: #c9cdd8; --edge: #767d8f;
    --text: #15171e; --dim: #454b5c; --faint: #5b6173; --gold: #80560a; --on-gold: #ffffff; --frost: #1a5fa0; --focus: #15171e; --danger: #c23b30;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --ground: #f4f5f8; --card: #ffffff; --shot: #e3e6ed; --raised: #ffffff; --rule: #dde0e7; --line: #c9cdd8; --edge: #767d8f;
  --text: #15171e; --dim: #454b5c; --faint: #5b6173; --gold: #80560a; --on-gold: #ffffff; --frost: #1a5fa0; --focus: #15171e; --danger: #c23b30;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); line-height: 1.5; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0; color: var(--gold); }
label { color: var(--dim); font-size: .9rem; }
select, textarea, button { font: inherit; color: var(--text); background: var(--ink-2); border: 1px solid var(--edge); border-radius: 6px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
select { padding: 4px 8px; }
textarea { width: 100%; min-height: 96px; padding: 10px; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; resize: vertical; }
button { padding: 8px 16px; cursor: pointer; }
button:hover, button:focus-visible { border-color: var(--gold); }
.box { background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 16px 0; }
.box > label { display: block; margin-bottom: 6px; }
.hint { color: var(--dim); font-size: .85rem; margin: 6px 0 10px; }
.err { color: var(--danger); margin: 10px 0 0; font-weight: 600; }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0; }
.totals div { background: var(--ink-3); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.totals dt { color: var(--dim); font-size: .8rem; }
.totals dd { margin: 0; font-size: 1.15rem; font-weight: 600; }
.panels { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 8px; }
.panel { min-width: 0; }
.gap { text-align: center; color: var(--frost); font-weight: 700; letter-spacing: .1em; border-left: 2px dashed var(--frost); margin: 0 auto; padding: 2px 0 2px 8px; width: max-content; grid-column: 1 / -1; }
ol.steps { list-style: none; margin: 0; padding: 0; }
ol.steps li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
ol.steps li:first-child { border-top: 0; }
ol.steps input { margin-top: 5px; width: 18px; height: 18px; flex: none; accent-color: var(--gold); }
ol.steps .n { color: var(--dim); min-width: 2em; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
ol.steps button.n { min-width: 2.2em; min-height: 26px; padding: 0 6px; margin-top: 1px; border: 1px solid var(--line); border-radius: 13px; background: var(--raised); color: var(--text); text-align: center; font-size: .9rem; }
ol.steps button.n:hover { border-color: var(--gold); }
ol.steps li.now { box-shadow: inset 3px 0 0 var(--gold); padding-left: 8px; }
ol.steps li.now button.n { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
ol.steps li.hit { background: color-mix(in srgb, var(--gold) 12%, transparent); }
@media (prefers-reduced-motion: no-preference) { ol.steps li { transition: background-color .4s; } }
ol.steps .done .t { text-decoration: line-through; color: var(--dim); }
ol.steps .z { color: var(--dim); font-size: .85rem; }
.note { color: var(--dim); font-size: .85rem; }
a { color: var(--frost); }
.links a { display: inline-block; padding: 6px 0; }
[hidden] { display: none !important; }
.real h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 8px; }
.real .row { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin: 12px 0; }
.real .row a.openbtn { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 18px; border: 1px solid var(--gold); border-radius: 8px;
  background: var(--gold); color: var(--on-gold); font-weight: 600; text-decoration: none; }
.real .row a.openbtn:hover, .real .row a.openbtn:focus-visible { border-color: var(--text); }
</style>
<main>
  <header>
    <h1 id="title"></h1>
    <span><label for="lang" id="langlabel"></label> <select id="lang"></select></span>
  </header>
  <section class="box">
    <label for="code" id="codelabel"></label>
    <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    <p class="hint" id="codehint"></p>
    <button type="button" id="show"></button>
    <p class="err" id="err" role="alert" hidden></p>
  </section>
  <div id="plan" hidden>
    <section class="box"><dl class="totals" id="totals"></dl></section>
    <section class="box"><div class="panels" id="panels"></div></section>
    <section class="box">
      <h2 id="stepshead" style="font-family:var(--display);font-weight:400;margin:0 0 8px"></h2>
      <ol class="steps" id="steps"></ol>
      <p class="note" id="more" hidden></p>
      <p><button type="button" id="clear"></button></p>
      <p class="note" id="local"></p>
    </section>
  </div>
  <section class="box real" aria-labelledby="realhead">
    <h2 id="realhead"></h2>
    <p class="hint" id="realtext"></p>
    <div class="row">
      <!-- OpenMap refuses to be shown inside another site (it answers a frame with "refused to connect"), so it is a link:
           the page never contacts openmap.world itself; only following the link does -->
      <a id="openmaptab" class="openbtn" href="https://openmap.world/" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <p class="note" id="realcredit"></p>
  </section>
  <p class="note" id="private"></p>
  <p class="note links"><a href="/guide-and-gold/phone/" id="howto"></a> · <a href="/">Fantasy Glass UI</a></p>
</main>
<script>
var WORDS = /*@WORDS@*/;
/*@READER@*/
/*@MAP@*/
(function () {
  var LANGS = [["en", "English"], ["de", "Deutsch"], ["fr", "Français"], ["es", "Español"], ["ru", "Русский"], ["pt", "Português"], ["it", "Italiano"], ["ko", "한국어"], ["zh", "中文"]];
  var ICON = { fly: "F", sail: "S", hearth: "H" };
  var $ = function (id) { return document.getElementById(id); };
  var lang = "en", code = "", result = null, ticks = {};

  function guessLang() {
    var l = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase().slice(0, 2);
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i][0] === l) return l;
    return "en";
  }
  function T(phrase) { var w = WORDS[phrase]; return (w && (w[lang] || w.en)) || phrase; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function minutes(s) {
    if (s === null || s === undefined) return "\u2014";                // (not in the code: a dash, never a made-up 0)
    var m = Math.round(s / 60), h = Math.floor(m / 60);
    return h > 0 ? T("%d h %d min").replace("%d", h).replace("%d", m % 60) : T("%d min").replace("%d", m);
  }
  function number(n) {                                                 // (in the language picked on the page, not the browser's)
    if (n === null || n === undefined) return "\u2014";
    try { return new Intl.NumberFormat(lang).format(n); } catch (e) { return String(n); }
  }
  function drawTotals(plan) {
    var t = FGPlan.totals(plan), box = $("totals");
    box.textContent = "";
    [["Experience", number(t.xp)], ["Time", minutes(t.seconds)], ["Levels", t.from + " → " + t.to],
     ["Flights", String(t.flights)], ["Crossings", String(t.crossings)], ["Steps", String(t.steps)]].forEach(function (r) {
      var d = el("div"); d.appendChild(el("dt", "", T(r[0]))); d.appendChild(el("dd", "", r[1])); box.appendChild(d);
    });
  }
  // the map of each zone (map.js): markers numbered by step like the list below, and linked to it both ways
  var reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  function current(plan) { for (var i = 0; i < plan.st.length; i++) if (!ticks[i]) return i; return -1; }
  function stepLabel(i) { return T("Step %d: %s").replace("%d", i + 1).replace("%s", result.plan.st[i].t); }
  function groupLabel(steps) {
    var ns = steps.map(function (i) { return i + 1; });
    return T("Steps %s: %s").replace("%s", ns.join(", ")).replace("%s", steps.map(function (i) { return result.plan.st[i].t; }).join("; "));
  }
  function toStep(i) {                                                 // a marker pressed: its step in the list
    var li = $("row" + i);
    if (!li) return;
    li.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    li.classList.add("hit");
    setTimeout(function () { li.classList.remove("hit"); }, 1600);
    try { $("s" + i).focus({ preventScroll: true }); } catch (e) { $("s" + i).focus(); }
  }
  function drawPanel(p, plan) {
    var wrap = el("div", "panel"), holder = el("div", "map");
    wrap.appendChild(el("h2", "", p.name));
    wrap.appendChild(holder);
    $("panels").appendChild(wrap);                                     // (in the page first: the map takes its width)
    var now = current(plan);
    FGPlanMap.draw(holder, p, { name: T("Map of the stops in %s").replace("%s", p.name), north: T("N"), northTitle: T("North is up"),
      label: stepLabel, group: groupLabel, current: now, done: function (i) { return !!ticks[i]; }, pick: toStep });
  }
  function drawPanels(plan) {
    var box = $("panels"), seen = {}, step = {};
    box.textContent = "";
    var all = FGPlan.panels(plan);
    all.forEach(function (p) { p.stops.forEach(function (st) { step[st.n] = st.step + 1; }); });   // (a leg is told by the step numbers the list shows)
    all.forEach(function (p) {
      p.legs.forEach(function (lg) {
        if (lg.from !== lg.to && !seen[lg.a + ":" + lg.b]) { seen[lg.a + ":" + lg.b] = 1; box.appendChild(el("div", "gap", ICON[lg.kind] + " " + step[lg.a] + " → " + step[lg.b])); }
      });
      drawPanel(p, plan);
    });
  }

  function storeKey() { return "fgui-plan-" + FGPlan.hash(code); }
  function loadTicks() {
    ticks = {};
    try { var v = JSON.parse(localStorage.getItem(storeKey()) || "[]"); if (Array.isArray(v)) v.forEach(function (i) { if (typeof i === "number") ticks[i] = true; }); } catch (e) {}
  }
  function saveTicks() {
    try { localStorage.setItem(storeKey(), JSON.stringify(Object.keys(ticks).map(Number))); } catch (e) {}
  }
  function drawSteps(plan) {
    var list = $("steps"), placed = {}, now = current(plan);
    list.textContent = "";
    FGPlan.panels(plan).forEach(function (p) { p.stops.forEach(function (st) { placed[st.step] = true; }); });
    plan.st.forEach(function (s, i) {
      var li = el("li", (ticks[i] ? "done" : "") + (i === now ? " now" : "")), box = el("input"), body = el("div", "t");
      li.id = "row" + i;
      box.type = "checkbox"; box.checked = !!ticks[i]; box.id = "s" + i;
      box.addEventListener("change", function () {
        if (box.checked) ticks[i] = true; else delete ticks[i];
        saveTicks();
        drawSteps(plan); drawPanels(plan);                             // (the next step moves on, on the map too)
        $("s" + i).focus();
      });
      var lab = el("label"); lab.htmlFor = box.id; lab.style.color = "inherit"; lab.style.fontSize = "1rem";
      lab.textContent = s.t;
      body.appendChild(lab);
      if (s.z !== null) body.appendChild(el("div", "z", plan.z[s.z - 1].n));
      if (placed[i]) {                                                 // the number: a button to its marker on the map
        var pin = el("button", "n", String(i + 1));
        pin.type = "button";
        pin.setAttribute("aria-label", T("Show step %d on the map").replace("%d", i + 1));
        pin.addEventListener("click", function () { FGPlanMap.show($("panels"), i, reduce); });
        li.appendChild(pin);
      } else li.appendChild(el("span", "n", String(i + 1)));
      li.appendChild(box); li.appendChild(body);
      list.appendChild(li);
    });
    var more = $("more");
    more.hidden = !(plan.more > 0);
    more.textContent = plan.more > 0 ? T("%d more steps are not shown.").replace("%d", plan.more) : "";
  }

  function words() {
    document.documentElement.lang = lang;
    document.title = T("Your route");
    $("title").textContent = T("Your route");
    $("langlabel").textContent = T("Language");
    $("codelabel").textContent = T("Paste a plan code");
    $("codehint").textContent = T("Copy the code in the game with Share plan, then paste it here.");
    $("show").textContent = T("Show the plan");
    $("stepshead").textContent = T("Steps");
    $("clear").textContent = T("Clear the ticks");
    $("local").textContent = T("Your ticks stay in this browser only.");
    $("private").textContent = T("Nothing is sent anywhere: the page reads the code here, in your browser.");
    $("howto").textContent = T("How to use this page");
    $("realhead").textContent = T("The real map");
    $("realtext").textContent = T("OpenMap shows WoW Forever's own zone maps. It's a separate site, made by other players.");
    $("openmaptab").textContent = T("Open OpenMap in a new tab");
    $("realcredit").textContent = T("Map art \u00a9 Blizzard Entertainment, shown by OpenMap (openmap.world). Not part of Fantasy Glass UI.");
    render();
  }
  function render() {
    var err = $("err"), view = $("plan");
    if (!result || result.ok || code === "") {
      err.hidden = true;
    } else {
      err.hidden = false;
      err.textContent = T(result.why === "empty" ? "That is not a plan code." : result.why === "kind" ? (result.other ? "That is a theme or layout code, not a plan code." : "That is not a plan code.")
                          : result.why === "version" ? "This code is from a newer version of the add-on." : "The code is damaged or cut short.");
    }
    if (result && result.ok) {
      view.hidden = false;
      drawTotals(result.plan); drawSteps(result.plan); drawPanels(result.plan);
    } else {
      view.hidden = true;
    }
  }
  function load(text, keepHash) {
    code = (text || "").replace(/^\s+|\s+$/g, "");
    result = code === "" ? null : FGPlan.read(code);
    if (result && result.ok) loadTicks(); else ticks = {};
    if (!keepHash) {
      try { history.replaceState(null, "", result && result.ok ? "#c=" + encodeURIComponent(code) : location.pathname + location.search); } catch (e) {}
    }
    render();
  }
  function fromHash() {
    var m = /^#c=(.*)$/.exec(location.hash || ""), text = "";
    if (m) { try { text = decodeURIComponent(m[1]); } catch (e) { text = ""; } }
    return text;
  }

  var pick = $("lang");
  LANGS.forEach(function (l) { var o = el("option", "", l[1]); o.value = l[0]; pick.appendChild(o); });
  try { lang = localStorage.getItem("fgui-plan-lang") || guessLang(); } catch (e) { lang = guessLang(); }
  if (!WORDS["Your route"] || !WORDS["Your route"][lang]) lang = "en";
  pick.value = lang;
  pick.addEventListener("change", function () {
    lang = pick.value;
    try { localStorage.setItem("fgui-plan-lang", lang); } catch (e) {}
    words();
  });
  $("show").addEventListener("click", function () { load($("code").value); });
  $("code").addEventListener("input", function () { load($("code").value); });
  $("clear").addEventListener("click", function () { ticks = {}; saveTicks(); if (result && result.ok) { drawSteps(result.plan); drawPanels(result.plan); } });
  window.addEventListener("hashchange", function () { var t = fromHash(); if (t && t !== code) { $("code").value = t; load(t, true); } });
  var first = fromHash();
  if (first) { $("code").value = first; load(first, true); }
  words();
})();
</script>
