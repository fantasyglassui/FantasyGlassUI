<script>
(function () {
  "use strict";
  var THEMES = window.FG_THEMES || [], NEWS = window.FG_NEWS || [];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  // the page's own words in the chosen language (filled in by the language code below; English as written)
  var WORDS = {};
  function L(s) { return (WORDS && WORDS[s]) || s; }
  var BASE = window.FG_BASE || "";            // "/" on fantasyglassui.com, where language pages live at /de/ and so on
  var SITE = "https://fantasyglassui.com/";
  function F(s) { var a = arguments, i = 1; return L(s).replace(/%[sd]/g, function () { return a[i++]; }); }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // the hero bars fill in once the page is up
  requestAnimationFrame(function () { setTimeout(function () { var h = $("hero"); if (h) h.classList.remove("load"); }, 120); });
  // the frames tilt toward the pointer, like turning a gem in the light
  (function tilt() {
    var st = document.querySelector(".stage"); if (!st || reduce || !window.matchMedia("(hover: hover)").matches) return;
    var band = document.querySelector(".hero-band");
    band.addEventListener("pointermove", function (e) {

    });

  })();
  // sections rise into view

    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, { rootMargin: "0px 0px -8% 0px" });

  })();
  // the numbers in the hero count up
  (function count() {
    if (reduce) return;
    document.querySelectorAll("#facts b").forEach(function (b) {
      var end = parseFloat(b.textContent); if (!(end > 0) || b.textContent.indexOf(".") !== -1) return;
      var t0 = performance.now() + 500;
      (function step(t) { var f = Math.min(1, Math.max(0, (t - t0) / 1100)); b.textContent = Math.round(end * (1 - Math.pow(1 - f, 3))); if (f < 1) requestAnimationFrame(step); else b.textContent = end; })(t0);
    });
  })();
  // before and after: the line follows the slider, a drag, or the arrow keys
  (function compare() {
    var box = $("cmp"), r = $("cmprange"); if (!box || !r) return;
    function set(v) { v = Math.round(Math.max(0, Math.min(100, v)) * 2) / 2; r.value = v; box.style.setProperty("--x", v + "%"); }
    r.addEventListener("input", function () { set(+r.value); });
    r.addEventListener("keydown", function (e) {
      var d = { ArrowLeft: -2, ArrowDown: -2, ArrowRight: 2, ArrowUp: 2, PageDown: -10, PageUp: 10 }[e.key];
      if (e.key === "Home") d = -100; if (e.key === "End") d = 100;
      if (d) { e.preventDefault(); set(+r.value + d); }
    });
    var down = false;
    function at(e) { var b = box.getBoundingClientRect(); set((e.clientX - b.left) / b.width * 100); }
    box.addEventListener("pointerdown", function (e) { e.preventDefault(); down = true; box.setPointerCapture(e.pointerId); at(e); r.focus({ preventScroll: true }); });
    box.addEventListener("pointermove", function (e) { if (down) at(e); });
    box.addEventListener("pointerup", function () { down = false; });
    box.addEventListener("pointercancel", function () { down = false; });
  })();
  // and then keep moving, the way a fight does: health dips and is healed, the breath fills and goes off
  (function fight() {
    if (reduce) return;
    var stage = document.querySelector(".stage"); if (!stage) return;
    var bars = stage.querySelectorAll(".bar"), tick = 0;
    var hp = [94, 81, 66, 88, 94], boss = [72, 71, 69, 68, 66], cast = [42, 70, 100, 8, 25];
    setInterval(function () {
      tick = (tick + 1) % hp.length;
      var set = function (bar, v, label) { bar.style.setProperty("--v", v + "%"); var n = bar.querySelector(".num"); if (n && label !== undefined) n.textContent = label; };
      set(bars[0], hp[tick], hp[tick] + "%");
      set(bars[2], boss[tick], boss[tick] + "%");
      set(bars[3], cast[tick]);
    }, 1600);
  })();

  // a quiet night sky behind everything
  (function sky() {
    var c = $("sky"); if (!c || !c.getContext) return;
    var ctx = c.getContext("2d"), stars = [], w = 0, h = 0, dpr = Math.min(2, window.devicePixelRatio || 1), dark = true, last = 0;
    function size() {
      dark = getComputedStyle(document.documentElement).colorScheme.indexOf("dark") !== -1;   // (asked here, not every frame: asking makes the browser work out the page's styles again)
      w = c.clientWidth; h = c.clientHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = []; var n = Math.round(w * h / 9000);
      for (var i = 0; i < n; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.1 + 0.2, p: Math.random() * 6.28, s: 0.4 + Math.random() * 1.2 });
    }
    function draw(t) {
      // the twinkle is slow: twenty frames a second look the same as sixty, and spare a phone's battery.
      // Full speed only while something moves quickly (the pointer's constellation, a shooting star).
      if (!reduce && px < 0 && !shot && t - last < 50) { requestAnimationFrame(draw); return; }
      last = t;
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i], a = reduce ? 0.55 : 0.35 + 0.35 * Math.sin(st.p + t / 1000 * st.s);
        ctx.fillStyle = dark ? "rgba(220,230,255," + a + ")" : "rgba(60,70,120," + (a * 0.35) + ")";
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.283); ctx.fill();
      }
      // stars near the pointer join up into a little constellation

        var near = [];
        for (var j = 0; j < stars.length; j++) { var dx = stars[j].x - px, dy = stars[j].y - py; if (dx * dx + dy * dy < 140 * 140) near.push(stars[j]); }

        var d2 = function (p, q) { var x = p.x - q.x, y = p.y - q.y; return x * x + y * y; };
        var cur = null, best = 1e9, here = { x: px, y: py };
        near.forEach(function (n) { var d = d2(n, here); if (d < best) { best = d; cur = n; } });
        ctx.lineWidth = 0.8; var used = [cur];
        for (var m = 0; cur && m < 6; m++) {
          var nx = null, nd = 95 * 95;
          near.forEach(function (n) { if (used.indexOf(n) === -1) { var d = d2(n, cur); if (d < nd) { nd = d; nx = n; } } });
          if (!nx) break;
          ctx.strokeStyle = "rgba(240,198,107," + (0.4 - m * 0.05) + ")";
          ctx.beginPath(); ctx.moveTo(cur.x, cur.y); ctx.lineTo(nx.x, nx.y); ctx.stroke();
          ctx.fillStyle = "rgba(255,236,190,.8)"; ctx.beginPath(); ctx.arc(nx.x, nx.y, 1.6, 0, 6.283); ctx.fill();
          used.push(nx); cur = nx;
        }
      }
      // now and then a shooting star
      if (dark && !reduce) {
        if (!shot && Math.random() < 0.004) shot = { x: Math.random() * w * 0.8, y: Math.random() * h * 0.4, life: 0 };
        if (shot) {
          shot.life += 1; var len = 90, k = shot.life * 9, sx = shot.x + k, sy = shot.y + k * 0.45;
          var g = ctx.createLinearGradient(sx, sy, sx - len, sy - len * 0.45);
          g.addColorStop(0, "rgba(255,248,225," + Math.max(0, 0.9 - shot.life / 40) + ")"); g.addColorStop(1, "rgba(255,248,225,0)");
          ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - len, sy - len * 0.45); ctx.stroke();
          if (shot.life > 40) shot = null;
        }
      }
      if (!reduce) requestAnimationFrame(draw);
    }
    var px = -1, py = -1, shot = null;
    window.addEventListener("pointermove", function (e) { px = e.clientX; py = e.clientY; }, { passive: true });
    document.addEventListener("pointerleave", function () { px = -1; });
    size(); window.addEventListener("resize", size); requestAnimationFrame(draw);
  })();

  // themes ------------------------------------------------------------------------------
  var fam = "All", chosenIdx = 0;
  var CLASS = "linear-gradient(135deg,#c79c6e,#f58cba,#abd473,#3fc7eb,#8787ed,#fff569,#ff7d0a,#0070de)";
  function pane(t) {
    var bg = t.bg || "#151a2c", bd = t.bd || "#4a4f63", ac = t.ac || "#f0c66b", tx = t.tx || "#e7e9f4";
    var ground, extra = "";
    if (t.f === "Glass") ground = "background:linear-gradient(160deg,#2c4a6e,#5b3a64 55%,#1d2b3b);";
    else ground = "background:" + bg + ";";
    var face;
    if (!t.bg) face = "background:" + CLASS + ";";
    else if (t.f === "Glass") face = "background:linear-gradient(180deg," + hexA(tx, .14) + "," + hexA(bg, .55) + " 30%," + hexA(bg, .72) + ");box-shadow:inset 0 1px 0 " + hexA("#ffffff", .55) + ",inset 0 0 0 1px " + hexA(bd, .8) + ";";
    else if (t.f === "Celestial") face = "background:radial-gradient(1px 1px at 20% 30%," + tx + ",transparent),radial-gradient(1px 1px at 70% 20%," + tx + ",transparent),radial-gradient(1.5px 1.5px at 85% 60%," + ac + ",transparent),radial-gradient(1px 1px at 40% 75%," + tx + ",transparent),linear-gradient(0deg," + hexA(ac, .22) + "," + bg + " 45%," + shade(bg, -.4) + ");box-shadow:inset 0 0 0 1px " + hexA(bd, .9) + ";";
    else face = "background:repeating-linear-gradient(45deg," + hexA("#ffffff", .025) + " 0 2px,transparent 2px 5px)," + bg + ";box-shadow:inset 0 0 0 1px " + bd + ",inset 0 0 0 2px #000;";
    if (t.f === "Fantasy" && t.bg) extra = '<span style="position:absolute;top:4px;left:4px;width:8px;height:8px;border-top:2px solid ' + ac + ';border-left:2px solid ' + ac + '"></span><span style="position:absolute;bottom:4px;right:4px;width:8px;height:8px;border-bottom:2px solid ' + ac + ';border-right:2px solid ' + ac + '"></span>';
    return '<div class="mini cut" style="' + ground + '"><div class="pane" style="' + face + 'color:' + tx + '"><b style="color:' + ac + '">' + esc(t.n) + '</b><i style="background:' + ac + ';box-shadow:0 0 8px ' + ac + '"></i><u style="background:' + tx + '"></u></div>' + extra + "</div>";
  }
  function hexA(hex, a) { var n = parseInt(hex.slice(1), 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }
  function shade(hex, f) { var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; var k = 1 + f; return "rgb(" + Math.round(r * k) + "," + Math.round(g * k) + "," + Math.round(b * k) + ")"; }
  var themesAll = false, PER = (window.matchMedia && window.matchMedia("(max-width: 600px)").matches) ? 4 : 6;
  function list() {
    var seen = {};
    return THEMES.map(function (t, i) { return { t: t, i: i }; }).filter(function (e) {
      if (fam !== "All" && e.t.f !== fam) return false;
      if (themesAll || fam !== "All") return true;
      seen[e.t.f] = (seen[e.t.f] || 0) + 1;                     // a row from each family to start
      return seen[e.t.f] <= PER || e.i === chosenIdx;
    });
  }
  function drawChosen() {
    var t = THEMES[chosenIdx]; if (!t) return;
    var about = { Glass: "See-through panes with soft shadows and a bright top edge.", Fantasy: "Solid panels with a dark rim, a grain and gold corner ornaments.", Celestial: "A moving night sky with twinkling stars, a breathing horizon and now and then a shooting star." }[t.f];
    var d = t.d ? L(t.d) : "";
    $("chosen").innerHTML = pane(t) + '<div><div class="eyebrow">' + esc(L(t.f)) + '</div><h3>' + esc(t.n) + '</h3><p>' + esc(d ? d.charAt(0).toUpperCase() + d.slice(1) + ". " : "") + esc(L(about)) + '</p><p>' + F("In the game: %s, then the %s row.", "<code>/fgui look</code>", esc(L(t.f))) + '</p>' +
      (t.bg ? '<div class="acts"><button class="btn primary cut" type="button" id="wear">' + L("Wear it on this page") + '</button><button class="btn soft cut" type="button" id="tweak">' + L("Change its colors") + '</button><button class="btn soft cut" type="button" id="tlink">' + L("Copy a link") + '</button></div>' : '<p>' + L("This one takes your class color, so it looks different for every class.") + '</p>') + '</div>';
  }
  function drawGallery() {
    var fams = ["All", "Glass", "Fantasy", "Celestial"];
    $("tfilters").innerHTML = fams.map(function (f) {
      var n = f === "All" ? THEMES.length : THEMES.filter(function (t) { return t.f === f; }).length;
      return '<button class="chip cut" type="button" data-f="' + f + '" aria-pressed="' + (f === fam) + '">' + esc(L(f)) + '<span>' + n + '</span></button>';
    }).join("");
    $("gallery").innerHTML = list().map(function (e) {
      return '<button class="tcard" type="button" data-i="' + e.i + '" aria-pressed="' + (e.i === chosenIdx) + '">' + pane(e.t) + '<span class="tn">' + esc(e.t.n) + '</span><span class="td">' + esc(L(e.t.d || e.t.f)) + "</span></button>";
    }).join("");
    $("tmore").hidden = themesAll || fam !== "All";
    $("tmore").textContent = F("Show all %d themes", THEMES.length);
  }
  $("tfilters").addEventListener("click", function (ev) { var b = ev.target.closest("[data-f]"); if (!b) return; fam = b.getAttribute("data-f"); drawGallery(); });
  $("gallery").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-i]"); if (!b) return;
    chosenIdx = +b.getAttribute("data-i"); drawChosen(); drawGallery();
    var c = $("chosen"); if (c.getBoundingClientRect().top < 60) c.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  });
  // wear a theme: the whole page takes its colors (and goes dark, as every theme is)
  var root = document.documentElement, before = null;
  if (!root.getAttribute("data-theme")) root.setAttribute("data-theme", "dark");     // a night sky: always dark
  function mix(a, b, f) {
    var x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
    var c = [16, 8, 0].map(function (sh) { var p = (x >> sh) & 255, q = (y >> sh) & 255; return Math.round(p + (q - p) * f); });
    return "rgb(" + c.join(",") + ")";
  }
  function wear(t, custom) {
    if (!t || !t.bg) return;
    if (before === null) before = root.getAttribute("data-theme");
    root.setAttribute("data-theme", "dark");
    var v = { "--ink": mix(t.bg, "#000000", .45), "--ink-2": t.bg, "--ink-3": t.pl || t.bg, "--line": t.bd, "--text": t.tx, "--dim": mix(t.tx, t.bg, .3), "--faint": mix(t.tx, t.bg, .52), "--gold": t.ac, "--frost": mix(t.ac, "#ffffff", .35) };
    for (var k in v) root.style.setProperty(k, v[k]);
    $("wearname").textContent = t.n; $("unwear").hidden = false;
    try { localStorage.setItem("fg-wear", custom ? "custom:" + JSON.stringify(t) : t.f + ":" + t.n); } catch (e) {}
  }
  function unwear() {
    ["--ink", "--ink-2", "--ink-3", "--line", "--text", "--dim", "--faint", "--gold", "--frost"].forEach(function (k) { root.style.removeProperty(k); });
    if (before === null) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", before);
    before = null; $("unwear").hidden = true;
    try { localStorage.removeItem("fg-wear"); } catch (e) {}
  }
  $("chosen").addEventListener("click", function (ev) { if (ev.target.closest("#wear")) wear(THEMES[chosenIdx]); });
  $("unwear").addEventListener("click", unwear);
  // theme maker: three colors and a family, worked out the way the add-on's ThemeFromDef does it ----------
  var mk = { name: "My theme", f: "Celestial", panel: "#121a33", rim: "#5a6a9a", accent: "#f0c66b" };
  var STYLE = { Glass: "GLASS", Fantasy: "FANTASY", Celestial: "CELESTIAL" };
  function rgb01(hex) { var n = parseInt(hex.slice(1), 16); return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; }
  function hex01(c) { return "#" + c.map(function (v) { var x = Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16); return x.length < 2 ? "0" + x : x; }).join(""); }
  function lift(c, f, add) { return c.map(function (v) { return Math.min(1, v * f + add); }); }
  function makerTheme() {
    var p = rgb01(mk.panel), pale = (p[0] * .30 + p[1] * .59 + p[2] * .11) > .55, fan = mk.f === "Fantasy";
    var text = fan ? (pale ? [.12, .10, .08] : [.90, .87, .80]) : (pale ? [.08, .09, .11] : [.93, .95, .98]);
    var plate = pale ? lift(p, .82, 0) : (fan ? lift(p, 2.25, .01) : lift(p, 2.6, .02));
    return { f: mk.f, n: mk.name || "My theme", d: "", bg: mk.panel, bd: mk.rim, ac: mk.accent, tx: hex01(text), pl: hex01(plate) };
  }
  function cleanName(n) {
    n = String(n || "").replace(/[|:\u0000-\u001f]/g, "").trim();
    var enc = window.TextEncoder ? new TextEncoder() : null;
    while (enc && enc.encode(n).length > 24) n = n.slice(0, -1);     // the add-on keeps 24 bytes
    return n || "My theme";
  }
  // the add-on's share format: S<bytes>:text, N<number>; and { key value ... } with the keys sorted
  function encode(v) {
    if (typeof v === "number") return "N" + String(Math.round(v * 10000) / 10000) + ";";
    if (typeof v === "string") return "S" + (window.TextEncoder ? new TextEncoder().encode(v).length : v.length) + ":" + v;
    var keys = Array.isArray(v) ? v.map(function (_, i) { return i + 1; }) : Object.keys(v);
    keys.sort(function (a, b) { a = String(a); b = String(b); return a < b ? -1 : a > b ? 1 : 0; });
    return "{" + keys.map(function (k) { return encode(k) + encode(Array.isArray(v) ? v[k - 1] : v[k]); }).join("") + "}";
  }
  function decode(s) {
    var i = 0;
    function one() {
      var c = s.charAt(i), j, n;
      if (c === "T") { i++; return true; } if (c === "F") { i++; return false; }
      if (c === "N") { j = s.indexOf(";", i); n = parseFloat(s.slice(i + 1, j)); if (j < 0 || isNaN(n)) throw 0; i = j + 1; return n; }
      if (c === "S") {
        j = s.indexOf(":", i); n = parseInt(s.slice(i + 1, j), 10); if (j < 0 || isNaN(n)) throw 0;
        var bytes = new TextEncoder().encode(s.slice(j + 1)), str = new TextDecoder().decode(bytes.slice(0, n));
        i = j + 1 + str.length; return str;
      }
      if (c === "{") { i++; var t = {}; while (s.charAt(i) !== "}") { if (i >= s.length) throw 0; var k = one(); t[k] = one(); } i++; return t; }
      throw 0;
    }
    var v = one(); if (i !== s.length) throw 0; return v;
  }
  function triple(t) { return t && typeof t[1] === "number" && typeof t[2] === "number" && typeof t[3] === "number" ? hex01([t[1], t[2], t[3]]) : null; }
  function makerCode() {
    var round = function (c) { return c.map(function (v) { return Math.round(v * 10000) / 10000; }); };
    return "SUIT1!" + encode({ name: cleanName(mk.name), panel: round(rgb01(mk.panel)), rim: round(rgb01(mk.rim)), accent: round(rgb01(mk.accent)), style: STYLE[mk.f] });
  }
  function drawMaker() {
    $("mkpane").innerHTML = pane(makerTheme());
    $("mkfam").innerHTML = ["Glass", "Fantasy", "Celestial"].map(function (f) { return '<button class="chip cut" type="button" data-mf="' + f + '" aria-pressed="' + (f === mk.f) + '">' + L(f) + "</button>"; }).join("");
    ["panel", "rim", "accent"].forEach(function (k) { $("mk" + k).value = mk[k]; $("mk" + k + "hex").textContent = mk[k].toUpperCase(); });
    $("mkcode").value = makerCode();
  }
  ["panel", "rim", "accent"].forEach(function (k) { $("mk" + k).addEventListener("input", function () { mk[k] = this.value; drawMaker(); }); });
  $("mkname").addEventListener("input", function () { mk.name = this.value; drawMaker(); });
  $("mkfam").addEventListener("click", function (ev) { var b = ev.target.closest("[data-mf]"); if (!b) return; mk.f = b.getAttribute("data-mf"); drawMaker(); });
  $("mkwear").addEventListener("click", function () { var t = makerTheme(); t.n = cleanName(mk.name); wear(t, true); });
  $("mkrandom").addEventListener("click", function () {
    var h = Math.random() * 360, hsl = function (h, s, l) { var c = document.createElement("canvas").getContext("2d"); c.fillStyle = "hsl(" + h + "," + s + "%," + l + "%)"; return c.fillStyle; };
    mk.panel = hsl(h, 30 + Math.random() * 30, 6 + Math.random() * 8); mk.rim = hsl(h + (Math.random() * 40 - 20), 25 + Math.random() * 30, 35 + Math.random() * 20);
    mk.accent = hsl(h + 120 + Math.random() * 120, 70 + Math.random() * 25, 55 + Math.random() * 15);
    mk.f = ["Glass", "Fantasy", "Celestial"][Math.floor(Math.random() * 3)]; drawMaker();
  });
  $("mkcopy").addEventListener("click", function () {
    var b = this, code = makerCode();
    function done(ok) { b.textContent = ok ? L("Copied") : L("Select the code and copy it"); setTimeout(function () { b.textContent = L("Copy the code"); }, 2000); }
    try { navigator.clipboard.writeText(code).then(function () { done(true); }, function () { $("mkcode").select(); done(false); }); } catch (e) { $("mkcode").select(); done(false); }
  });
  function loadCode(txt) {
    var msg = $("mkinmsg");
    if (!txt) { msg.textContent = ""; return false; }
    try {
      if (txt.indexOf("SUIT1!") !== 0) throw 0;
      var d = decode(txt.slice(6)), p = triple(d.panel), r = triple(d.rim), a = triple(d.accent);
      if (!p || !r || !a) throw 0;
      mk.panel = p; mk.rim = r; mk.accent = a; mk.f = d.style === "FANTASY" ? "Fantasy" : d.style === "GLASS" ? "Glass" : "Celestial";
      mk.name = typeof d.name === "string" ? d.name : "My theme"; $("mkname").value = mk.name;
      drawMaker(); msg.textContent = L("Loaded. Change it as you like."); return true;
    } catch (e) { msg.textContent = L("That isn't a theme code (they start with SUIT1!)."); return false; }
  }
  $("mkin").addEventListener("input", function () { loadCode(this.value.trim()); });
  // links to a theme or to a made theme: fantasyglassui.com/?theme=celestial-polaris#themes, ?code=SUIT1!...#maker
  function slug(t) { return (t.f + "-" + t.n).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function pageUrl() { return SITE + (lang && lang !== "en" ? lang + "/" : ""); }
  function copyLink(btn, url, label) {
    function done(ok) { btn.textContent = ok ? L("Link copied") : url; setTimeout(function () { btn.textContent = L(label); }, 2200); }

  }
  $("chosen").addEventListener("click", function (ev) {
    var b = ev.target.closest("#tlink"); if (!b) return;

  });
  $("mklink").addEventListener("click", function () { copyLink(this, pageUrl() + "?code=" + encodeURIComponent(makerCode()) + "#maker", "Copy a link to it"); });
  // "Change its colors" on the chosen theme starts the maker from it
  $("chosen").addEventListener("click", function (ev) {

    else if (worn) for (var j = 0; j < THEMES.length; j++) if (THEMES[j].f + ":" + THEMES[j].n === worn) { chosenIdx = j; wear(THEMES[j]); }
  } catch (e) {}
  drawChosen(); drawGallery();

  // screenshots ------------------------------------------------------------------------------
  (function openLink() {
    var q = location.search, m = /[?&]theme=([a-z0-9-]+)/.exec(q), c = /[?&]code=([^&#]+)/.exec(q), go = null;
    if (m) for (var i = 0; i < THEMES.length; i++) if (slug(THEMES[i]) === m[1]) { chosenIdx = i; fam = "All"; go = "themes"; }
    if (c) { var code = ""; try { code = decodeURIComponent(c[1]); } catch (e) {} if (code) { $("mkin").value = code; if (loadCode(code)) go = "maker"; } }
    if (go) { drawChosen(); drawGallery(); setTimeout(function () { var el = $(go); if (el) el.scrollIntoView({ block: "start" }); }, 60); }
  })();
  var SHOTS = [
    ["celestial-live", "Before and after", "The same spot in Stormwind Harbor, before and after, in a Celestial theme."],
    ["celestial-overview", "Celestial", "A whole screen in a Celestial theme: party, player and target, cast bar, action bars and the minimap."],
    ["glass-overview", "Glass", "The same screen in a Glass theme."],
    ["fantasy-overview", "Fantasy", "The same screen in a Fantasy theme."],
    ["celestial-frames", "Unit frames", "The player and target frames up close, with the pet, the cast bar, buffs and the target's target."],
    ["glass-bags", "Bags", "The bags in one window, with item quality on every cut slot, and search, sort and equip best along the top."],
    ["glass-settings", "Options window", "The options window: every theme in one place, and every feature can be switched off."]
  ];
  var shotIdx = 0;
  function drawThumbs() {
    $("thumbs").innerHTML = SHOTS.map(function (s, i) {
      return '<button class="thumb" type="button" data-n="' + i + '" aria-pressed="' + (i === shotIdx) + '"><img class="cut" src="' + BASE + 'shots/' + s[0] + '-480.webp" alt="" loading="lazy" width="320" height="180"><span>' + esc(L(s[1])) + "</span></button>";
    }).join("");
  }
  $("thumbs").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-n]"); if (!b) return;
    shotIdx = +b.getAttribute("data-n"); var s = SHOTS[shotIdx];
    $("shot-img").srcset = BASE + "shots/" + s[0] + "-800.webp 800w, " + BASE + "shots/" + s[0] + ".webp 2400w"; $("shot-img").src = BASE + "shots/" + s[0] + ".webp"; $("shot-img").alt = L(s[2]); $("shot-cap").textContent = L(s[2]);
    $("cmp").hidden = shotIdx !== 0; $("shot-big").hidden = shotIdx === 0;     // the first is the before-and-after slider
    drawThumbs();
  });
  drawThumbs();

  // what's new ------------------------------------------------------------------------------
  function drawNews(list) {
    $("news").innerHTML = list.map(function (v) {
      return '<div class="ver cut"><h3>' + esc(v.v) + "</h3><ul>" + v.items.map(function (x) { return "<li>" + esc(L(x)) + "</li>"; }).join("") + "</ul></div>";
    }).join("");
  }
  var curNews = NEWS.slice(0, 2);
  drawNews(curNews);
  (function () {                                   // the version shown at the top: the newest in the page's own list
    var fv = $("f-version"); if (fv && NEWS.length) fv.textContent = NEWS[0].v.split(".").slice(0, 2).join(".");
  })();
  // keep itself current: read the changelog on GitHub and use it when it is newer than what is built in
  function newer(a, b) { a = a.split(".").map(Number); b = b.split(".").map(Number); for (var i = 0; i < 3; i++) { if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0); } return false; }
  function fromChangelog(md) {
    var parts = md.split(/^## +(\d+\.\d+\.\d+)[^\n]*$/m), out = [];
    for (var i = 1; i + 1 < parts.length && out.length < 6; i += 2) {
      var groups = [], cur = null;
      parts[i + 1].split("\n").forEach(function (line) {
        var g = line.match(/^\*\*(.+?)\*\*\s*$/); if (g) { cur = { name: g[1], topics: [] }; groups.push(cur); return; }
        var m = line.match(/^- (.+)/); if (!m) return;
        if (!cur) { cur = { name: "", topics: [] }; groups.push(cur); }
        var t = m[1], c = t.indexOf(": ");
        if (c <= 0 || c > 40) return;   // a sentence, not "Topic: what changed"
        t = t.slice(0, c).replace(/\*\*|`/g, "");
        if (cur.topics.indexOf(t) === -1) cur.topics.push(t);
      });
      // "New: boss guide" style headings with prose under them are joined: "New: a, b and c."
      var items = [], joined = {};
      groups.forEach(function (g) {
        if (g.topics.length) {
          items.push((g.name ? g.name + ": " : "") + g.topics.slice(0, 6).join(", ") + (g.topics.length > 6 ? " and " + (g.topics.length - 6) + " more" : "") + ".");
        } else if (g.name) {
          var c2 = g.name.indexOf(": "), head = c2 > 0 ? g.name.slice(0, c2) : g.name, rest = c2 > 0 ? g.name.slice(c2 + 2) : "";
          if (!rest) { items.push(head + "."); return; }
          if (!joined[head]) { joined[head] = []; items.push(joined[head]); joined[head].head = head; }
          joined[head].push(rest);
        }
      });
      items = items.map(function (x) {
        if (typeof x === "string") return x;
        var l = x.length > 1 ? x.slice(0, -1).join(", ") + " and " + x[x.length - 1] : x[0];
        return x.head + ": " + l + ".";
      });
      if (items.length) out.push({ v: parts[i], items: items });
    }
    return out;
  }
  if (window.fetch) fetch("https://raw.githubusercontent.com/fantasyglassui/FantasyGlassUI/main/CHANGELOG.md", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw 0; return r.text(); })
    .then(function (md) {
      var list = fromChangelog(md); if (!list.length) return;
      if (NEWS.length && !newer(list[0].v, NEWS[0].v)) return;
      curNews = list.slice(0, 2); drawNews(curNews);
      var fv = $("f-version"); if (fv) fv.textContent = list[0].v.split(".").slice(0, 2).join(".");
    })["catch"](function () {});

  // features and commands ----------------------------------------------------------------------
  var DATA = null, sec = null, opened = {}, FIRST = 8;
  function mark(text, q) {
    var t = esc(text); if (!q) return t;
    var i = t.toLowerCase().indexOf(esc(q).toLowerCase()); if (i < 0) return t;
    return t.slice(0, i) + "<mark>" + t.slice(i, i + esc(q).length) + "</mark>" + t.slice(i + esc(q).length);
  }
  function drawFeatures() {
    if (!DATA) return;
    var q = $("fsearch").value.trim().toLowerCase(), shown = 0, total = 0, html = "";
    if (!sec) sec = DATA.sections[0].title;
    $("ffilters").innerHTML = DATA.sections.map(function (s) { return s.title; }).map(function (t) {
      return '<button class="chip cut" type="button" data-s="' + esc(t) + '" aria-pressed="' + (!q && t === sec) + '">' + esc(L(t)) + "<span>" + DATA.sections.filter(function (x) { return x.title === t; })[0].items.length + "</span></button>";
    }).join("");
    DATA.sections.forEach(function (s) {
      total += s.items.length;
      if (!q && s.title !== sec) return;                       // one section at a time; a search looks through all
      var items = s.items.filter(function (it) { return !q || (it.label + " " + it.desc + " " + L(it.label) + " " + L(it.desc)).toLowerCase().indexOf(q) !== -1; });
      if (!items.length) return;
      shown += items.length;
      var all = q || opened[s.title] || items.length <= FIRST + 2;
      var show = all ? items : items.slice(0, FIRST);
      html += '<div class="fsec">' + (q ? "<h3>" + esc(L(s.title)) + "<small>" + items.length + "</small></h3>" : "") + '<div class="flist">' + show.map(function (it) {
        return '<div class="fitem cut"><b>' + mark(L(it.label), q) + "</b>" + (it.desc ? "<span>" + mark(L(it.desc), q) + "</span>" : "") + "</div>";
      }).join("") + "</div>" + (all ? "" : '<button class="more cut" type="button" data-open="' + esc(s.title) + '">' + F("Show all %d", items.length) + "</button>") + "</div>";
    });
    $("flist").innerHTML = html || '<p class="count">' + L("No switch matches that. Try a shorter word.") + '</p>';
    $("fcount").textContent = F("%d of %d switches", shown, total);
    $("f-switches").textContent = total;
  }
  var cmdsAll = false;
  function drawCommands() {
    if (!DATA) return;
    var q = $("csearch").value.trim().toLowerCase();
    var rows = DATA.commands.filter(function (c) { return !q || (c.cmd + " " + c.desc + " " + L(c.desc)).toLowerCase().indexOf(q) !== -1; });
    var short = !q && !cmdsAll;
    if (short) rows = rows.slice(0, 10);                           // the everyday ones first
    $("cmore").hidden = !short; $("cmore").textContent = F("Show all %d commands", DATA.commands.length);
    $("clist").innerHTML = rows.map(function (c) {
      return '<tr><th scope="row"><code>' + mark(c.cmd, q) + "</code></th><td>" + mark(L(c.desc), q) + '</td><td><button class="copy cut" type="button" data-c="' + esc(c.cmd.split(" ")[0] + (c.cmd.split(" ")[1] && c.cmd.split(" ")[1].charAt(0) !== "[" && c.cmd.split(" ")[1].charAt(0) !== "<" ? " " + c.cmd.split(" ")[1] : "")) + '">' + L("Copy") + '</button></td></tr>';
    }).join("") || '<tr><td colspan="3" class="count">' + L("No command matches that.") + '</td></tr>';
    $("ccount").textContent = F("%d of %d commands", rows.length, DATA.commands.length);
    $("f-commands").textContent = DATA.commands.length;
  }
  $("ffilters").addEventListener("click", function (ev) { var b = ev.target.closest("[data-s]"); if (!b) return; sec = b.getAttribute("data-s"); $("fsearch").value = ""; drawFeatures(); });
  $("fsearch").addEventListener("input", drawFeatures);
  $("flist").addEventListener("click", function (ev) { var b = ev.target.closest("[data-open]"); if (!b) return; opened[b.getAttribute("data-open")] = true; drawFeatures(); });
  $("copyall").addEventListener("click", function () {
    if (!DATA) return;
    var text = DATA.commands.map(function (c) { return c.cmd + "  -  " + L(c.desc); }).join("\n"), b = $("copyall");
    function done(ok) { b.textContent = ok ? F("Copied %d commands", DATA.commands.length) : L("Copy did not work here: select the table instead"); setTimeout(function () { b.textContent = L("Copy the whole list"); }, 2200); }
    try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
  });
  $("csearch").addEventListener("input", drawCommands);
  $("cmore").addEventListener("click", function () { cmdsAll = true; drawCommands(); });
  $("tmore").addEventListener("click", function () { themesAll = true; drawGallery(); });
  $("clist").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-c]"); if (!b) return;
    var text = b.getAttribute("data-c");
    function done(ok) { b.textContent = ok ? L("Copied") : text; setTimeout(function () { b.textContent = L("Copy"); }, 1600); }
    try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
  });
  // languages: the page's own words come from i18n/<code>.json; the switches, commands and news use the
  // add-on's own translations, so they read the same as in the game ------------------------------------
  var LANGS = [["en", "English"], ["de", "Deutsch"], ["fr", "Français"], ["es", "Español"], ["ru", "Русский"], ["pt", "Português"], ["it", "Italiano"], ["ko", "한국어"], ["zh", "中文"]];
  var SEL = "header.top nav a, #unwear, .hero .eyebrow, .hero h1, .hero .lede, .hero .cta a, .facts .w, .ribbon span, .mock, section.block .wrap > header .eyebrow, section.block .wrap > header h2, section.block .wrap > header .lede, .compare .tag, .piece h3, .piece p, #copyall, .mk-row > span, .mk-color b, #mkwear, #mkrandom, #mkcopy, #mklink, #mkshare, .mk-paste summary, .q summary, .q p, .step h3, .step p, .help h3, .help p, .help .btn, #fby, #trnote";
  var EN = [], lang = "en";
  document.querySelectorAll(SEL).forEach(function (el) { EN.push([el, el.innerHTML.replace(/\s+/g, " ").trim()]); });
  var PH = [["fsearch", "placeholder"], ["csearch", "placeholder"]].map(function (p) { var el = $(p[0]); return [el, p[1], el.getAttribute(p[1])]; });
  function applyLang() {
    var worn = $("wearname").textContent;
    EN.forEach(function (e) { var w = WORDS[e[1]]; e[0].innerHTML = w || e[1]; });
    $("wearname").textContent = worn;
    PH.forEach(function (p) { p[0].setAttribute(p[1], L(p[2])); });
    root.setAttribute("lang", lang); $("trnote").hidden = lang === "en";
    drawChosen(); drawGallery(); drawThumbs(); $("shot-cap").textContent = L(SHOTS[shotIdx][2]); drawNews(curNews); drawMaker(); drawFeatures(); drawCommands(); drawVisits();
  }
  function setLang(code, save) {
    if (!LANGS.some(function (l) { return l[0] === code; })) code = "en";
    $("lang").value = code;
    if (save) {
      try { localStorage.setItem("fg-lang", code); } catch (e) {}
      if (BASE && history.replaceState) history.replaceState(null, "", BASE + (code === "en" ? "" : code + "/") + location.search + location.hash);
    }
    if (code === "en") { lang = "en"; WORDS = {}; applyLang(); return; }
    fetch(BASE + "i18n/" + code + ".json").then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (w) { lang = code; WORDS = w; applyLang(); })["catch"](function () { lang = "en"; WORDS = {}; applyLang(); });
  }
  $("lang").innerHTML = LANGS.map(function (l) { return '<option value="' + l[0] + '" lang="' + l[0] + '">' + l[1] + "</option>"; }).join("");
  $("lang").addEventListener("change", function () { setLang(this.value, true); });
  fetch(BASE + "features.json").then(function (r) { return r.json(); }).then(function (d) { DATA = d; drawFeatures(); drawCommands(); })
    .catch(function () { $("flist").innerHTML = '<p class="count">' + L("The list of switches could not be loaded. Reload the page to try again.") + '</p>'; });
  // a small visit count in the footer, from GoatCounter (shown only once its counter answers)
  var visits = null;
  function drawVisits() { var v = $("visits"); if (!v || visits === null) return; v.innerHTML = F("%s visits", "<b>" + esc(visits) + "</b>"); v.hidden = false; }
  if (window.fetch && /fantasyglassui\.com$/.test(location.hostname)) fetch("https://fantasyglassui.goatcounter.com/counter/TOTAL.json")
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) { if (d && d.count) { visits = String(d.count); drawVisits(); } })["catch"](function () {});
  // first visit: the link's ?lang=, then the last choice, then the browser's language
  (function () {
    var code = window.FG_LANG || null, m = /[?&]lang=([a-z]{2})/.exec(location.search);
    if (!code && m) code = m[1];
    if (!code) { try { code = localStorage.getItem("fg-lang"); } catch (e) {} }
    if (!code) code = String(navigator.language || "en").slice(0, 2).toLowerCase();
    if (code !== "en") setLang(code, false); else $("lang").value = "en";
  })();
})();
</script>
