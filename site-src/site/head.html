/* Layout: a night sky behind a column of cut-gem panels; the Starcut cut (corners clipped away) is the one shape used throughout. */
:root {
  --ink: #0a0c15;        /* the sky */
  --ink-2: #11152a;      /* a panel */
  --ink-3: #191e38;      /* a raised panel */
  --line: #2b3256;       /* rims */
  --text: #e7e9f4;
  --dim: #a4abc7;
  --faint: #868dad;
  --gold: #f0c66b;       /* the Starcut glow */
  --frost: #8fd3ff;      /* second light */
  --hp: #3fcf7a;
  --mana: #4f8dff;
  --danger: #e2574c;
  --display: "Marcellus FG", "Marcellus", Georgia, serif;   /* the add-on's own lettering */
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --cut: 12px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ink: #eef0f7; --ink-2: #ffffff; --ink-3: #f6f7fc; --line: #cdd2e6;
    --text: #151a30; --dim: #4a5170; --faint: #7a809c;
    --gold: #a8741a; --frost: #2271b3; --hp: #1f9a52; --mana: #2f63d6; --danger: #c23b30;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --ink: #eef0f7; --ink-2: #ffffff; --ink-3: #f6f7fc; --line: #cdd2e6;
  --text: #151a30; --dim: #4a5170; --faint: #7a809c;
  --gold: #a8741a; --frost: #2271b3; --hp: #1f9a52; --mana: #2f63d6; --danger: #c23b30;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { background: var(--ink); color: var(--text); font: 16px/1.6 var(--body); }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--frost); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; letter-spacing: 0.02em; margin: 0; }
h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); }
.eyebrow { font: 600 0.75rem/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.lede { color: var(--dim); max-width: 62ch; }
.cut { clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }

/* header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--ink) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
header.top .wrap { max-width: 1280px; gap: 16px; }
header.top nav.links { gap: 4px 14px; }
@media (max-width: 560px) { header.top > .wrap { column-gap: 10px; } header.top .lang svg { display: none; } header.top .brand { gap: 8px; font-size: 1rem; } header.top .dc { padding: 7px 9px; } header.top .dc span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
@media (min-width: 901px) and (max-width: 1260px) { header.top .dc { padding: 7px 9px; } header.top .dc span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
.brand { display: flex; align-items: center; gap: 10px; font: 400 1.12rem/1 var(--display); color: var(--text); text-decoration: none; }
.brand img { width: 30px; height: 30px; display: block; }
nav.links { display: flex; gap: 4px 16px; flex-wrap: wrap; margin-left: auto; }
nav.links a { color: var(--dim); text-decoration: none; font-weight: 600; font-size: 0.92rem; }
nav.links a:hover { color: var(--text); }
.draft { font: 600 0.7rem/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); background: var(--gold); padding: 5px 8px; }

/* hero: always the game's night, whatever the page's theme */
.hero-band { position: relative; overflow: hidden; background: #06070d; --text: #eef0f8; --dim: #c3c9e0; color: var(--text); border-bottom: 1px solid var(--line); }
.hero-band .shot-bg { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: 60% 50%; opacity: .62; }
.hero-band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,7,13,.96) 0%, rgba(6,7,13,.82) 38%, rgba(6,7,13,.25) 75%, rgba(6,7,13,.55) 100%), linear-gradient(0deg, rgba(6,7,13,.9), transparent 30%); }
.hero-band .wrap { z-index: 2; }
.hero-band .mock { top: auto; bottom: 14px; left: auto; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 3; }
/* hero */
.hero { padding-block: 72px 64px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 40px; align-items: center; }
.hero h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1.02; }
.hero h1 span { color: var(--gold); }
.hero p { font-size: 1.12rem; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; font: 700 0.95rem/1 var(--body); text-decoration: none; border: 0; cursor: pointer; }
.btn.primary { background: var(--gold); color: #1a1405; }
.btn.ghost { background: rgba(20,24,44,.8); color: #eef0f8; box-shadow: inset 0 0 0 1px #3a4370; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 26px; color: var(--dim); font-size: 0.92rem; }
.facts b { color: var(--text); font-variant-numeric: tabular-nums; }

/* the Starcut frames, drawn */
.stage { position: relative; max-width: 440px; justify-self: end; width: 100%; padding: 26px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: radial-gradient(120% 90% at 70% 0%, color-mix(in srgb, var(--frost) 14%, transparent), transparent 60%), linear-gradient(180deg, #0d1226, #070910); }
.stage .label { position: absolute; top: 10px; right: 14px; font: 600 0.7rem/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: #7f88ad; }
.uf { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; margin-bottom: 22px; }
.uf:last-child { margin-bottom: 0; }
.portrait { position: relative; width: 52px; height: 52px; margin: 6px; transform: rotate(45deg); background: linear-gradient(135deg, #2a335e, #12162b); box-shadow: 0 0 0 1px #a9b7e8, 0 0 18px rgba(143, 211, 255, .35); }
.portrait i { position: absolute; inset: 0; display: grid; place-items: center; transform: rotate(-45deg); font: 700 1.3rem/1 var(--display); color: #f6e7c1; font-style: normal; }
.portrait::before, .portrait::after { content: ""; position: absolute; width: 12px; height: 12px; background: #fff3cf; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); filter: drop-shadow(0 0 4px #f0c66b); }
.portrait::before { top: -7px; left: -7px; }
.portrait::after { bottom: -7px; right: -7px; }
.uf .who { display: flex; justify-content: space-between; font: 600 0.88rem/1.2 var(--body); color: #e7e9f4; margin-bottom: 6px; }
.uf .who span:last-child { color: #f0c66b; font-variant-numeric: tabular-nums; }
.bar { --c: var(--hp); position: relative; height: 20px; background: #05060c; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); }
.bar.thin { height: 10px; margin-top: 5px; --c: #4f8dff; clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%); }
.bar .fill { position: absolute; inset: 0 auto 0 0; width: var(--v, 50%); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 100%, white 25%), var(--c) 55%, color-mix(in srgb, var(--c) 70%, black)); box-shadow: 0 0 14px var(--c); transition: width 1.4s cubic-bezier(.2, .8, .2, 1); }
.bar .num { position: absolute; inset: 0; display: grid; place-items: center; font: 700 0.78rem/1 var(--body); color: #fff; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.glow { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c, #3fcf7a) 60%, transparent)); }
.cast { margin-top: 8px; --c: #f0a24b; height: 14px; }
.cast .num { font-size: 0.7rem; justify-content: start; padding-left: 16px; display: flex; align-items: center; }
.load .bar .fill { width: 0; }

/* sections */
section.block { padding-block: 56px; border-top: 1px solid var(--line); }
section.block > .wrap > header { display: grid; gap: 10px; margin-bottom: 28px; }

/* the look: four pieces */
.pieces { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
