:root {
  /* the site's tokens (site/base.css), dark and light; the older names below are kept for this page's rules */
  --ground: #12141a; --card: #181b22; --shot: #1c2029; --raised: #1e222b; --rule: #22262f; --line: #2c313c; --edge: #6b7287;
  --text: #e7e9f4; --dim: #a4abc7; --faint: #8a91b0; --gold: #f0c66b; --on-gold: #14110a; --frost: #8fd3ff; --focus: #ffffff; --danger: #e2574c;
  --ink: var(--ground); --ink-2: var(--card); --ink-3: var(--raised);
  --display: "Marcellus FG", Georgia, serif;
  --body: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #f4f5f8; --card: #ffffff; --shot: #e3e6ed; --raised: #ffffff; --rule: #dde0e7; --line: #c9cdd8; --edge: #767d8f;
    --text: #15171e; --dim: #454b5c; --faint: #5b6173; --gold: #80560a; --on-gold: #ffffff; --frost: #1a5fa0; --focus: #15171e; --danger: #c23b30;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --ground: #f4f5f8; --card: #ffffff; --shot: #e3e6ed; --raised: #ffffff; --rule: #dde0e7; --line: #c9cdd8; --edge: #767d8f;
  --text: #15171e; --dim: #454b5c; --faint: #5b6173; --gold: #80560a; --on-gold: #ffffff; --frost: #1a5fa0; --focus: #15171e; --danger: #c23b30;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); line-height: 1.5; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0; color: var(--gold); }
label { color: var(--dim); font-size: .9rem; }
select, textarea, button { font: inherit; color: var(--text); background: var(--ink-2); border: 1px solid var(--edge); border-radius: 6px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
select { padding: 4px 8px; }
textarea { width: 100%; min-height: 96px; padding: 10px; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; resize: vertical; }
button { padding: 8px 16px; cursor: pointer; }
button:hover, button:focus-visible { border-color: var(--gold); }
.box { background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 16px 0; }
.box > label { display: block; margin-bottom: 6px; }
.hint { color: var(--dim); font-size: .85rem; margin: 6px 0 10px; }
.err { color: var(--danger); margin: 10px 0 0; font-weight: 600; }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0; }
.totals div { background: var(--ink-3); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.totals dt { color: var(--dim); font-size: .8rem; }
.totals dd { margin: 0; font-size: 1.15rem; font-weight: 600; }
.panels { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 8px; }
.panel { min-width: 0; }
.gap { text-align: center; color: var(--frost); font-weight: 700; letter-spacing: .1em; border-left: 2px dashed var(--frost); margin: 0 auto; padding: 2px 0 2px 8px; width: max-content; grid-column: 1 / -1; }
ol.steps { list-style: none; margin: 0; padding: 0; }
ol.steps li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
ol.steps li:first-child { border-top: 0; }
ol.steps input { margin-top: 5px; width: 18px; height: 18px; flex: none; accent-color: var(--gold); }
ol.steps .n { color: var(--dim); min-width: 2em; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
ol.steps button.n { min-width: 2.2em; min-height: 26px; padding: 0 6px; margin-top: 1px; border: 1px solid var(--line); border-radius: 13px; background: var(--raised); color: var(--text); text-align: center; font-size: .9rem; }
ol.steps button.n:hover { border-color: var(--gold); }
ol.steps li.now { box-shadow: inset 3px 0 0 var(--gold); padding-left: 8px; }
ol.steps li.now button.n { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
ol.steps li.hit { background: color-mix(in srgb, var(--gold) 12%, transparent); }
@media (prefers-reduced-motion: no-preference) { ol.steps li { transition: background-color .4s; } }
ol.steps .done .t { text-decoration: line-through; color: var(--dim); }
ol.steps .z { color: var(--dim); font-size: .85rem; }
.note { color: var(--dim); font-size: .85rem; }
a { color: var(--frost); }
.links a { display: inline-block; padding: 6px 0; }
[hidden] { display: none !important; }
/* the route on the world map (/map/'s tiles, drawn by Leaflet once a plan is shown). The map's own colours (its sea,
   the pins and the line) are the same in light and dark, as the map art is; everything around it uses the tokens. */
.route h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 8px; }
.views { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.views button { padding: 4px 12px; min-height: 34px; border-radius: 17px; font-size: .9rem; background: var(--raised); border-color: var(--line); }
.views button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 600; }
.mapframe { --sea: #2e3c44; position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sea); }
.routemap { width: 100%; height: clamp(320px, 62vh, 560px); background: var(--sea); }
.mapframe .mapwait, .mapframe .maphint { position: absolute; left: 8px; right: auto; margin: 0; padding: 4px 10px; border-radius: 6px;
  background: #12141a; color: #e7e9f4; font-size: .85rem; z-index: 1000; pointer-events: none; }
.mapframe .mapwait { top: 8px; }
.mapframe .maphint { bottom: 8px; max-width: calc(100% - 16px); }
.routemap.leaflet-container { font: 400 .95rem/1.4 var(--body); background: var(--sea); }
.routemap .leaflet-bar { border: 1px solid #2c313c; border-radius: 6px; box-shadow: none; overflow: hidden; }
.routemap .leaflet-bar a, .routemap .leaflet-bar a:hover { width: 36px; height: 36px; font: 700 20px/34px var(--body); color: #f0c66b; background: #1e222b; border-bottom-color: #2c313c; }
.routemap .leaflet-bar a.leaflet-disabled { color: #8a91b0; background: #1e222b; }
.routemap .leaflet-bar a:focus-visible, .routemap.leaflet-container:focus-visible { outline: 2px solid #ffffff; outline-offset: -2px; }
.routemap .leaflet-popup-content-wrapper, .routemap .leaflet-popup-tip { background: var(--card); color: var(--text); border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .45); }
.routemap .leaflet-popup-content-wrapper { border: 1px solid var(--gold); }
.routemap .leaflet-popup-content { margin: 10px 14px; max-height: 260px; overflow-y: auto; }
.routemap a.leaflet-popup-close-button { color: var(--dim); width: 30px; height: 30px; font: 400 22px/28px var(--body); }
.rt-pop > div + div { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
.rt-pop strong { display: block; font-size: .8rem; color: var(--dim); font-weight: 600; }
.rt-pop p { margin: 2px 0 4px; color: var(--text); font-size: .95rem; }
.rt-pop .z { display: block; color: var(--dim); font-size: .8rem; }
.rt-pop button { margin-top: 4px; padding: 3px 10px; font-size: .85rem; }
/* a pin: its number, its kind by colour and shape (accept: gold circle; do: dark circle with a gold rim; turn in: green
   square; travel: blue diamond corners; other: grey) */
.rt-pin { display: flex; align-items: center; justify-content: center; box-sizing: border-box; border: 2px solid #14110a; border-radius: 13px;
  font: 700 12px/1 var(--body); font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: 0 1px 4px rgba(0, 0, 0, .7); cursor: pointer; }
.rt-pin.k-accept { background: #f0c66b; color: #14110a; }
.rt-pin.k-do { background: #1e222b; color: #f0c66b; border-color: #f0c66b; }
.rt-pin.k-turnin { background: #8fe0a0; color: #0e1a12; border-radius: 4px; }
.rt-pin.k-travel { background: #8fd3ff; color: #0a1620; border-radius: 4px 13px; }
.rt-pin.k-other, .rt-pin.k-mix { background: #e7e9f4; color: #15171e; }
.rt-pin.done { opacity: .55; }
.rt-pin.now { box-shadow: 0 0 0 3px #ffffff, 0 0 0 5px #14110a; }
.rt-pin:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
.rt-now { border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 0 0 2px #14110a, inset 0 0 0 2px #14110a; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .rt-now { animation: rt-beat 1.6s ease-out infinite; } }
@keyframes rt-beat { 0% { opacity: 1; } 70% { opacity: .35; } 100% { opacity: 1; } }
.rt-line { pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; list-style: none; margin: 10px 0 0; padding: 0; color: var(--dim); font-size: .85rem; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend .rt-pin { width: 18px; height: 18px; font-size: 0; box-shadow: none; cursor: default; }
.route .credit { margin: 8px 0 0; }

<main>
  <header>
    <h1 id="title"></h1>
    <span><label for="lang" id="langlabel"></label> <select id="lang"></select></span>
  </header>
  <section class="box">
    <label for="code" id="codelabel"></label>
    <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    <p class="hint" id="codehint"></p>
    <button type="button" id="show"></button>
    <p class="err" id="err" role="alert" hidden></p>
  </section>
  <div id="plan" hidden>
    <section class="box"><dl class="totals" id="totals"></dl></section>
    <section class="box route" id="routebox" aria-labelledby="maphead">
      <h2 id="maphead"></h2>
      <div class="views" id="views" role="group" hidden></div>
      <div class="mapframe" id="mapframe">
        <div id="routemap" class="routemap" role="region"></div>
        <p class="mapwait" id="mapwait" hidden></p>
        <p class="maphint" id="maphint" hidden></p>
      </div>
      <ul class="legend" id="legend"></ul>
      <p class="note" id="unplaced" hidden></p>
      <p class="note credit" id="mapcredit"></p>
      <!-- the zones the world map does not have (an island added later, say): each one's sketch (map.js) -->
      <div class="panels" id="offpanels" hidden></div>
      <!-- only when the world map cannot be loaded: each zone's sketch (map.js) -->
      <p class="note" id="sketchnote" hidden></p>
      <div class="panels" id="panels" hidden></div>
    </section>
    <section class="box">
      <h2 id="stepshead" style="font-family:var(--display);font-weight:400;margin:0 0 8px"></h2>
      <ol class="steps" id="steps"></ol>
      <p class="note" id="more" hidden></p>
      <p><button type="button" id="clear"></button></p>
      <p class="note" id="local"></p>
    </section>
  </div>
  <section class="box real" aria-labelledby="realhead">
    <h2 id="realhead"></h2>
    <p class="hint" id="realtext"></p>
    <div class="row">
      <!-- OpenMap refuses to be shown inside another site (it answers a frame with "refused to connect"), so it is a link:
           the page never contacts openmap.world itself; only following the link does -->
      <a id="openmaptab" class="openbtn" href="https://openmap.world/" target="_blank" rel="noopener noreferrer"></a>
      <!-- the world map on this site (/map/): the same art, with nothing asked of another site -->
      <a id="worldmaptab" class="openbtn line" href="/map/"></a>
    </div>
    <p class="note" id="realcredit"></p>
  </section>
  <p class="note" id="private"></p>
  <p class="note links"><a href="/guide-and-gold/phone/" id="howto"></a> · <a href="/">Fantasy Glass UI</a></p>
</main>

    return rt.zones.names && own.call(rt.zones.names, zn.n) ? rt.zones.names[zn.n] : null;
  }
  // draw the plan on the maps; fresh (a new code): fit the views again
  function paint(plan, fresh) {
    var map = rt.map, V = rt.world, at = FGPlan.place(plan, rt.zones), now = current(plan), prevNow = rt.now;
    rt.plan = plan; rt.code = code; rt.at = at; rt.now = now;
    var items = [];
    at.forEach(function (p, i) { if (p) items.push({ i: i, p: p }); });
    // a zone the world map does not have (its steps have a place in the zone, but none on the map): its own map when
    // the site has one (/plan/zones.json "images"), else a sketch of it; and no empty world map when no step is on it
    var off = [];
    plan.st.forEach(function (s, i) { if (!at[i] && s.z !== null && s.x !== null && s.y !== null && off.indexOf(s.z) < 0) off.push(s.z); });
    rt.off = off;
    var onMap = items.length > 0, wasHidden = $("mapframe").hidden;
    ["mapframe", "mapcredit"].forEach(function (id) { $(id).hidden = !onMap; });
    if (onMap && wasHidden) fresh = true;
    route(V, plan, items);
    drawOff(plan, off, fresh);
    $("legend").hidden = !onMap && !Object.keys(rt.offp).some(function (z) { return !!rt.offp[z].V; });
    // the views: the whole route, or one zone's steps
    var zs = [];
    V.placed.forEach(function (p) { var z = zoneOf(plan, p.i); if (zs.indexOf(z) < 0) zs.push(z); });
    rt.zs = zs;
    if (fresh) {
      var nz = nowZone(plan);
      rt.view = zs.length > 1 && nz !== null ? nz : "all";
    } else if (rt.view !== "all" && now !== prevNow) {                 // following a zone: on to the next one with the steps
      var z2 = nowZone(plan);
      if (z2 !== null && z2 !== rt.view) { rt.view = z2; fresh = true; }
    }
    if (zs.indexOf(rt.view) < 0) rt.view = "all";
    views(plan);
    // the steps with no place at all: listed, not pinned
    var none = [];
    plan.st.forEach(function (s, i) { if (!at[i] && (s.z === null || s.x === null || s.y === null)) none.push(i + 1); });
    $("unplaced").hidden = !none.length;
    $("unplaced").textContent = none.length ? T(none.length === 1 ? "Step %s has no place on the map." : "Steps %s have no place on the map.").replace("%s", none.join(", ")) : "";
    if (!onMap) { V.pins.clearLayers(); V.sig = null; V.byStep = {}; return; }
    map.invalidateSize();
    map.setMinZoom(Math.max(0, Math.floor(map.getBoundsZoom(rt.all, false) * 2) / 2));
    if (fresh) fit(); else if (V.nowAt && now !== prevNow) map.panInside(V.nowAt, { padding: [40, 40], animate: !reduce });
    pins(V, true);
  }
  // the zones off the world map, each in a panel: its own map (Leaflet over the zone's map art, 0-100 across and down
  // it), or a sketch (map.js) when the site has no art for it or the art does not load
  function drawOff(plan, off, fresh) {
    var box = $("offpanels"), sig = off.join(",");
    box.hidden = !off.length;
    var ps = FGPlan.panels(plan).filter(function (p) { return off.indexOf(p.zone) >= 0; });
    if (fresh || sig !== rt.offSig) {
      rt.offSig = sig;
      Object.keys(rt.offp).forEach(function (z) { var o = rt.offp[z]; if (o.V) { o.V.map.remove(); rt.tamed = rt.tamed.filter(function (t) { return t.map !== o.V.map; }); } });
      rt.offp = {};
      box.textContent = "";
      ps.forEach(function (p) {
        var id = zoneId(plan, p.zone), img = id !== null && rt.zones.images ? rt.zones.images[String(id)] : null;
        if (img && !(rt.noArt || {})[id]) offMap(p, plan, box, img, id);
        else drawPanel(p, plan, box, true);
        rt.offp[p.zone].wrap.id = "off-z" + p.zone;
      });
    } else ps.forEach(function (p) {                                   // (a tick, or another language: the same maps, drawn again)
      var o = rt.offp[p.zone];
      if (!o) return;
      if (o.V) { o.map.setAttribute("aria-label", T("Map of the stops in %s").replace("%s", p.name)); offRoute(o, plan, p); pins(o.V, true); }
      else FGPlanMap.draw(o.holder, p, sketchOpts(p, plan));
    });
    Object.keys(rt.offp).forEach(function (z) {
      var o = rt.offp[z];
      o.note.textContent = T(o.V ? "%s is not on the world map yet, so it has its own map." : "%s is not on the world map yet, so its steps are drawn as a sketch.").replace("%s", o.p.name);
      if (o.credit) o.credit.textContent = T("Map art © Blizzard Entertainment");
    });
  }
  function offMap(p, plan, box, img, id) {
    var w = +img.size[0], h = +img.size[1];
    var wrap = el("div", "panel"), note = el("p", "note"), frame = el("div", "mapframe zoneframe"), holder = el("div", "routemap zonemap"), hint = el("p", "maphint");
    var credit = el("p", "note credit");
    wrap.appendChild(el("h2", "", p.name)); wrap.appendChild(note);
    holder.setAttribute("role", "region");
    holder.setAttribute("aria-label", T("Map of the stops in %s").replace("%s", p.name));
    hint.textContent = T("Tap the map, then drag to move it.");
    frame.appendChild(holder); frame.appendChild(hint); wrap.appendChild(frame); wrap.appendChild(credit);
    box.appendChild(wrap);
    var bounds = [[0, 0], [h, w]];
    var map = L.map(holder, opts(18, 0.25));
    holder._fgMap = map;
    var V = view(map, function (q) { return L.latLng(h - q[1], q[0]); }, 0);
    var o = rt.offp[p.zone] = { wrap: wrap, note: note, credit: credit, map: holder, V: V, p: p, size: [w, h] };
    L.imageOverlay(img.src, bounds, { alt: "", interactive: false }).on("error", function () {
      (rt.noArt = rt.noArt || {})[id] = 1;                             // (the art did not load: a sketch instead)
      setTimeout(function () { if (result && result.ok) drawOff(result.plan, rt.off, true); }, 0);
    }).addTo(map);
    map.setMaxBounds(L.latLngBounds(bounds).pad(0.1));
    map.fitBounds(bounds, { animate: false });
    var z0 = map.getZoom();
    map.setMinZoom(z0); map.setMaxZoom(z0 + 3); V.near = z0 + 1.5;
    tame(V, holder, hint);
    offRoute(o, plan, p);
    pins(V, true);
    return o;
  }
  function offRoute(o, plan, p) {                                      // (a step's 0-100 on the zone's own map art)
    route(o.V, plan, p.stops.map(function (st) { return { i: st.step, p: [st.x / 100 * o.size[0], st.y / 100 * o.size[1]] }; }));
  }
  function nowZone(plan) {                                             // the zone of the current step, or of the next one with a place
    for (var i = Math.max(0, rt.now); i < plan.st.length; i++) if (rt.at[i]) return zoneOf(plan, i);
    return null;
  }
  function fit() {
    fitTo(rt.world, rt.world.placed.filter(function (p) { return rt.view === "all" || zoneOf(rt.plan, p.i) === rt.view; }).map(function (p) { return p.ll; }), 36);
  }
  function views(plan) {
    var row = $("views");
    row.textContent = "";
    row.setAttribute("aria-label", T("Map view"));
    var chips = (rt.world.placed.length ? ["all"].concat(rt.zs) : []).concat(rt.off.map(function (z) { return -z; }));
    row.hidden = chips.length < 2;
    chips.forEach(function (z) {
      var b = el("button", "", z === "all" ? T("Whole route") : plan.z[Math.abs(z) - 1].n);
      b.type = "button";
      if (z !== "all" && z < 0) {                                      // a zone not on the world map: to its own map or sketch
        b.addEventListener("click", function () {
          var w = $("off-z" + -z);
          if (!w) return;
          w.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
          w.classList.add("hit");
          setTimeout(function () { w.classList.remove("hit"); }, 1600);
        });
        row.appendChild(b);
        return;
      }
      b.setAttribute("aria-pressed", String(rt.view === z));
      b.addEventListener("click", function () {
        rt.view = z;
        [].forEach.call(row.querySelectorAll("[aria-pressed]"), function (c) { c.setAttribute("aria-pressed", String(c === b)); });
        fit(); pins(rt.world, false);
      });
      row.appendChild(b);
    });
  }
  // the pins at this zoom: those closer than a pin share one
  function pins(V, force) {
    var map = V.map, P = V.placed;
    if (!map.getSize().x || map.getZoom() === undefined) return;
    var z = map.getZoom(), pts = P.map(function (p) { return map.project(p.ll, z); });
    var up = P.map(function (p, i) { return i; });
    function top(i) { while (up[i] !== i) i = up[i] = up[up[i]]; return i; }
    for (var a = 0; a < P.length; a++)
      for (var b = a + 1; b < P.length; b++)
        if (pts[a].distanceTo(pts[b]) < 26) { var ta = top(a), tb = top(b); if (ta !== tb) up[Math.max(ta, tb)] = Math.min(ta, tb); }
    var groups = {}, order = [];
    P.forEach(function (p, i) { var t = top(i); if (!groups[t]) { groups[t] = []; order.push(t); } groups[t].push(i); });
    var sig = order.map(function (t) { return groups[t].join(","); }).join("|");
    if (!force && sig === V.sig) return;
    V.sig = sig;
    V.pins.clearLayers();
    V.byStep = {};
    order.forEach(function (t) {
      var g = groups[t], steps = g.map(function (k) { return P[k].i; });
      var run = g.every(function (k, j) { return !j || k === g[j - 1] + 1; });
      var text = steps.length === 1 ? String(steps[0] + 1) : FGPlanMap.rangeText(steps.map(function (i) { return i + 1; }), run);
      var kinds = {}; g.forEach(function (k) { kinds[P[k].kind] = 1; });
      var kind = Object.keys(kinds).length === 1 ? P[g[0]].kind : "mix";
      var isNow = steps.indexOf(rt.now) >= 0, done = !isNow && steps.every(function (i) { return !!ticks[i]; });
      var lat = 0, lng = 0;
      g.forEach(function (k) { lat += P[k].ll.lat; lng += P[k].ll.lng; });
      var w = Math.max(26, text.length * 7 + 12), num = el("span", "", text), label = steps.length === 1 ? stepLabel(steps[0]) : groupLabel(steps);
      var m = L.marker([lat / g.length, lng / g.length], {
        icon: L.divIcon({ className: "rt-pin k-" + kind + (done ? " done" : "") + (isNow ? " now" : ""), html: num, iconSize: [w, 26], iconAnchor: [w / 2, 13], popupAnchor: [0, -14] }),
        title: label, keyboard: true, riseOnHover: true, zIndexOffset: isNow ? 1000 : 0 });
      m.bindPopup(function () { return popup(steps, V); }, { maxWidth: 260, autoPanPadding: [24, 24] });
      m.addTo(V.pins);
      var e = m.getElement();
      if (e) { e.setAttribute("aria-label", label); e.setAttribute("data-steps", steps.join(" ")); if (isNow) e.setAttribute("aria-current", "step"); }
      steps.forEach(function (i) { V.byStep[i] = m; });
    });
  }
  function popup(steps, V) {                                           // (every word in it is plain text)
    var box = el("div", "rt-pop"), plan = rt.plan;
    steps.forEach(function (i) {
      var s = plan.st[i], row = el("div"), kind = KIND[s.k] || "other";
      row.appendChild(el("strong", "", T("Step %d").replace("%d", i + 1) + " · " + T(KIND_WORDS.filter(function (k) { return k[0] === kind; })[0][1])));
      row.appendChild(el("p", "", s.t));
      if (s.z !== null) row.appendChild(el("span", "z", plan.z[s.z - 1].n));
      var go = el("button", "", T("Show in the list"));
      go.type = "button";
      go.addEventListener("click", function () { V.map.closePopup(); toStep(i); });
      row.appendChild(go);
      box.appendChild(row);
    });
    return box;
  }
  function showStep(i) {                                               // a step's number in the list: its pin, opened
    if (rt.state === "failed") return FGPlanMap.show($("panels"), i, reduce);
    if (rt.state !== "ready") return;
    var V = rt.world, o = null, at = null;
    if (rt.at[i]) at = V.ll(rt.at[i]);
    else {                                                             // (a step in a zone the world map does not have)
      o = rt.offp[zoneOf(rt.plan, i)];
      if (!o) return;
      if (!o.V) return FGPlanMap.show(o.wrap, i, reduce);
      V = o.V;
      at = V.placed.filter(function (p) { return p.i === i; })[0];
      if (!at) return;
      at = at.ll;
    }
    (o ? o.wrap : $("mapframe")).scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
    V.map.setView(at, Math.max(V.map.getZoom(), V.near), { animate: false });
    pins(V, false);
    var m = V.byStep[i];
    if (!m) return;
    m.openPopup();
    var e = m.getElement();
    if (e) { try { e.focus({ preventScroll: true }); } catch (x) { e.focus(); } }
  }
  function mapWords() {
    $("maphead").textContent = T("The route on the map");
    $("routemap").setAttribute("aria-label", T("Map of the route"));
    $("mapwait").textContent = T("Loading the map…");
    $("maphint").textContent = T("Tap the map, then drag to move it.");
    $("sketchnote").textContent = T("The world map could not be loaded, so each zone is drawn as a sketch.");
    var cr = $("mapcredit"), a = el("a", "", T("Full credits on the world map"));
    a.href = lang === "en" ? "/map/" : "/" + lang + "/map/";
    cr.textContent = T("Map art © Blizzard Entertainment, map pieces from OpenMap.") + " ";
    cr.appendChild(a);
    var lg = $("legend");
    lg.textContent = "";
    KIND_WORDS.forEach(function (k) {
      var li = el("li"), dot = el("span", "rt-pin k-" + k[0]);
      dot.setAttribute("aria-hidden", "true");
      li.appendChild(dot); li.appendChild(document.createTextNode(T(k[1])));
      lg.appendChild(li);
    });
    [].forEach.call($("routebox").querySelectorAll(".leaflet-control-zoom"), function (bar) {
      var c = bar.querySelectorAll("a");
      [["Zoom in", 0], ["Zoom out", 1]].forEach(function (z) { if (c[z[1]]) { c[z[1]].title = T(z[0]); c[z[1]].setAttribute("aria-label", T(z[0])); } });
    });
    [].forEach.call($("routebox").querySelectorAll(".zoneframe .maphint"), function (h) { h.textContent = T("Tap the map, then drag to move it."); });
  }

  // the fallback, only when the world map cannot be loaded: each zone's sketch (map.js), linked to the list both ways
  // a zone's sketch (map.js), linked to the list both ways: every zone when the world map cannot be loaded, or a zone
  // off the world map with no map art of its own (then box is #offpanels, and the panel is remembered with its note)
  function sketchOpts(p, plan) {
    return { name: T("Map of the stops in %s").replace("%s", p.name), north: T("N"), northTitle: T("North is up"),
             label: stepLabel, group: groupLabel, current: current(plan), done: function (i) { return !!ticks[i]; }, pick: toStep };
  }
  function drawPanel(p, plan, box, note) {
    var wrap = el("div", "panel"), holder = el("div", "map"), n = note ? el("p", "note") : null;
    wrap.appendChild(el("h2", "", p.name));
    if (n) wrap.appendChild(n);
    wrap.appendChild(holder);
    (box || $("panels")).appendChild(wrap);                            // (in the page first: the map takes its width)
    FGPlanMap.draw(holder, p, sketchOpts(p, plan));
    if (n) rt.offp[p.zone] = { wrap: wrap, note: n, holder: holder, p: p };
    return wrap;
  }
  function drawPanels(plan) {
    var box = $("panels"), seen = {}, step = {};
    box.textContent = "";
    var all = FGPlan.panels(plan);
    all.forEach(function (p) { p.stops.forEach(function (st) { step[st.n] = st.step + 1; }); });   // (a leg is told by the step numbers the list shows)
    all.forEach(function (p) {
      p.legs.forEach(function (lg) {
        if (lg.from !== lg.to && !seen[lg.a + ":" + lg.b]) { seen[lg.a + ":" + lg.b] = 1; box.appendChild(el("div", "gap", ICON[lg.kind] + " " + step[lg.a] + " → " + step[lg.b])); }
      });
      drawPanel(p, plan);
    });
  }
  // which steps the list's numbers can show: every step with a place in its zone (on the world map, or on a sketch)
  function shown(plan) {
    var ok = {};
    FGPlan.panels(plan).forEach(function (p) { p.stops.forEach(function (st) { ok[st.step] = true; }); });
    return ok;
  }

  function storeKey() { return "fgui-plan-" + FGPlan.hash(code); }
  function loadTicks() {
    ticks = {};
    try { var v = JSON.parse(localStorage.getItem(storeKey()) || "[]"); if (Array.isArray(v)) v.forEach(function (i) { if (typeof i === "number") ticks[i] = true; }); } catch (e) {}
  }
  function saveTicks() {
    try { localStorage.setItem(storeKey(), JSON.stringify(Object.keys(ticks).map(Number))); } catch (e) {}
  }
  function drawSteps(plan) {
    var list = $("steps"), placed = shown(plan), now = current(plan);
    list.textContent = "";
    plan.st.forEach(function (s, i) {
      var li = el("li", (ticks[i] ? "done" : "") + (i === now ? " now" : "")), box = el("input"), body = el("div", "t");
      li.id = "row" + i;
      box.type = "checkbox"; box.checked = !!ticks[i]; box.id = "s" + i;
      box.addEventListener("change", function () {
        if (box.checked) ticks[i] = true; else delete ticks[i];
        saveTicks();
        drawSteps(plan); drawMap(plan, false);                         // (the next step moves on, on the map too)
        $("s" + i).focus();
      });
      var lab = el("label"); lab.htmlFor = box.id; lab.style.color = "inherit"; lab.style.fontSize = "1rem";
      lab.textContent = s.t;
      body.appendChild(lab);
      if (s.z !== null) body.appendChild(el("div", "z", plan.z[s.z - 1].n));
      if (placed[i]) {                                                 // the number: a button to its marker on the map
        var pin = el("button", "n", String(i + 1));
        pin.type = "button";
        pin.setAttribute("aria-label", T("Show step %d on the map").replace("%d", i + 1));
        pin.addEventListener("click", function () { showStep(i); });
        li.appendChild(pin);
      } else li.appendChild(el("span", "n", String(i + 1)));
      li.appendChild(box); li.appendChild(body);
      list.appendChild(li);
    });
    var more = $("more");
    more.hidden = !(plan.more > 0);
    more.textContent = plan.more > 0 ? T("%d more steps are not shown.").replace("%d", plan.more) : "";
  }

  function words() {
    document.documentElement.lang = lang;
    document.title = T("Your route");
    $("title").textContent = T("Your route");
    $("langlabel").textContent = T("Language");
    $("codelabel").textContent = T("Paste a plan code");
    $("codehint").textContent = T("Copy the code in the game with Share plan, then paste it here.");
    $("show").textContent = T("Show the plan");
    $("stepshead").textContent = T("Steps");
    $("clear").textContent = T("Clear the ticks");
    $("local").textContent = T("Your ticks stay in this browser only.");
    $("private").textContent = T("Nothing is sent anywhere: the page reads the code here, in your browser.");
    $("howto").textContent = T("How to use this page");
    $("realhead").textContent = T("The real map");
    $("realtext").textContent = T("OpenMap shows WoW Forever's own zone maps. It's a separate site, made by other players.");
    $("openmaptab").textContent = T("Open OpenMap in a new tab");
    $("worldmaptab").textContent = T("Open the world map");
    $("realcredit").textContent = T("Map art \u00a9 Blizzard Entertainment, shown by OpenMap (openmap.world). Not part of Fantasy Glass UI.");
    mapWords();
    render();
  }
  function render() {
    var err = $("err"), view = $("plan");
    if (!result || result.ok || code === "") {
      err.hidden = true;
    } else {
      err.hidden = false;
      err.textContent = T(result.why === "empty" ? "That is not a plan code." : result.why === "kind" ? (result.other ? "That is a theme or layout code, not a plan code." : "That is not a plan code.")
                          : result.why === "version" ? "This code is from a newer version of the add-on." : "The code is damaged or cut short.");
    }
    if (result && result.ok) {
      view.hidden = false;
      drawTotals(result.plan); drawMap(result.plan, false); drawSteps(result.plan);
    } else {
      view.hidden = true;
    }
  }
  function load(text, keepHash) {
    code = (text || "").replace(/^\s+|\s+$/g, "");
    result = code === "" ? null : FGPlan.read(code);
    if (result && result.ok) loadTicks(); else ticks = {};
    if (!keepHash) {
      try { history.replaceState(null, "", result && result.ok ? "#c=" + encodeURIComponent(code) : location.pathname + location.search); } catch (e) {}
    }
    render();
  }
  function fromHash() {
    var m = /^#c=(.*)$/.exec(location.hash || ""), text = "";
    if (m) { try { text = decodeURIComponent(m[1]); } catch (e) { text = ""; } }
    return text;
  }

  var pick = $("lang");
  LANGS.forEach(function (l) { var o = el("option", "", l[1]); o.value = l[0]; pick.appendChild(o); });
  try { lang = localStorage.getItem("fgui-plan-lang") || guessLang(); } catch (e) { lang = guessLang(); }
  if (!WORDS["Your route"] || !WORDS["Your route"][lang]) lang = "en";
  pick.value = lang;
  pick.addEventListener("change", function () {
    lang = pick.value;
    try { localStorage.setItem("fgui-plan-lang", lang); } catch (e) {}
    words();
  });
  $("show").addEventListener("click", function () { load($("code").value); });
  $("code").addEventListener("input", function () { load($("code").value); });
  $("clear").addEventListener("click", function () { ticks = {}; saveTicks(); if (result && result.ok) { drawSteps(result.plan); drawMap(result.plan, false); } });
  window.addEventListener("hashchange", function () { var t = fromHash(); if (t && t !== code) { $("code").value = t; load(t, true); } });
  var first = fromHash();
  if (first) { $("code").value = first; load(first, true); }
  words();
})();
</script>
