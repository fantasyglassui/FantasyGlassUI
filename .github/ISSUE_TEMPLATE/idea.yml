name: Idea or request
description: Something you'd like Fantasy Glass UI to do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and when would you use it?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you manage today
      description: Another add-on, a workaround, or nothing at all.
