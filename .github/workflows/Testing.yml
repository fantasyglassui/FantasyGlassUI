# Checks every push and pull request: luacheck reads the Lua for mistakes (a misspelled name, a
# variable used before it is set), then the tests load the add-on in a stand-in for the game and
# exercise every part of it, and the two audits check what it does during a fight.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check

      - name: Check the Lua code
        run: luacheck .

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install what the tests need
        run: pip install -r tests/requirements.txt

      # The hidden-value audit reads each file once and keeps what it learned; this keeps it between runs.
      - uses: actions/cache@v4
        with:
          path: tests/.cache
          key: audit-${{ hashFiles('FantasyGlassUI/**/*.lua', 'FantasyGlassUI_Options/**/*.lua') }}
          restore-keys: audit-

      - name: Run the tests
        run: pytest tests -v
