# Releases Fantasy Glass UI: pushing a version tag (for example 11.9.1) builds the zip from the
# three add-on folders and uploads it to CurseForge, with RELEASE.md as its changelog, and also
# attaches it to a GitHub release. Needs the repository secret CF_API_TOKEN (a CurseForge API token).
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and upload
        uses: BigWigsMods/packager@v2
        with:
          args: -n "Fantasy Glass UI {project-version}:FantasyGlassUI-{project-version}"
