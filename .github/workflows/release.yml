# Releases Fantasy Glass UI: builds the zip from the five add-on folders and uploads it to
# CurseForge, with RELEASE.md as its changelog, and also attaches it to a GitHub release. Needs the
# repository secret CF_API_TOKEN (a CurseForge API token).
#
# Three ways to start it:
#   - push a version tag (for example 12.0.1)
#   - push a commit to main with [release] in its message: the version is read from
#     FantasyGlassUI/FantasyGlassUI.toc, tagged here, and released (only if that tag is new)
#   - push a commit with [beta] in its message, on main or on a branch named beta/<name>: the same,
#     but the version must look like 13.5.0-beta.1. CurseForge files it as Beta and GitHub makes a
#     prerelease. A commit cannot say both [release] and [beta].
#
# To cut a beta: set "## Version:" in all five TOCs and ns.version in Core.lua to 13.5.0-beta.1
# (raise the number for the next one), then commit with [beta] in the message. The version checks
# live in .github/release-version.sh.
name: Release

on:
  push:
    branches:
      - main
      - "beta/**"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  release:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) || contains(github.event.head_commit.message, '[beta]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which kind
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/beta/')
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          kind=""
          case "$MESSAGE" in *"[release]"*) kind=release ;; esac
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then kind=release; fi
          case "$MESSAGE" in
            *"[beta]"*)
              if [ -n "$kind" ]; then echo "a commit cannot say both [release] and [beta]"; exit 1; fi
              kind=beta ;;
          esac
          if [ -z "$kind" ]; then echo "nothing to release from here"; exit 1; fi
          echo "KIND=$kind" >> "$GITHUB_ENV"

      - name: Tag the version ([release] and [beta] commits)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/beta/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(bash .github/release-version.sh "$KIND") || { echo "$version"; exit 1; }
          echo "Version in the TOC: $version"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            # already tagged: release it only if it has not been released yet (a run that stopped part way)
            if gh release view "$version" >/dev/null 2>&1; then
              echo "$version is already released: raise the version before releasing again"; exit 1
            fi
            echo "$version is tagged but not released yet: releasing that tag"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$version" -m "$version"
            git push origin "refs/tags/$version"
          fi
          echo "RELEASE_TAG=$version" >> "$GITHUB_ENV"

      # A tag pushed from here starts no run of its own, so this run packages it. The packager skips a
      # branch build whose commit is tagged, so it is told it is building the tag.
      - name: Build and upload ([release] and [beta] commits)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/beta/')
        run: |
          git checkout -q "refs/tags/$RELEASE_TAG"
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "$RUNNER_TEMP/release.sh"
          GITHUB_REF="refs/tags/$RELEASE_TAG" GITHUB_REF_NAME="$RELEASE_TAG" GITHUB_REF_TYPE=tag \
            bash "$RUNNER_TEMP/release.sh" -n "Fantasy Glass UI {project-version}:FantasyGlassUI-{project-version}"

      - name: Build and upload (tag pushes)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/beta/')
        uses: BigWigsMods/packager@v2
        with:
          args: -n "Fantasy Glass UI {project-version}:FantasyGlassUI-{project-version}"
