# Releases Fantasy Glass UI: builds the zip from the three add-on folders and uploads it to
# CurseForge, with RELEASE.md as its changelog, and also attaches it to a GitHub release. Needs the
# repository secret CF_API_TOKEN (a CurseForge API token).
#
# Two ways to start it:
#   - push a version tag (for example 12.0.1)
#   - push a commit to main with [release] in its message: the version is read from
#     FantasyGlassUI/FantasyGlassUI.toc, tagged here, and released (only if that tag is new)
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  release:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the version ([release] commits)
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(grep -m1 '^## Version:' FantasyGlassUI/FantasyGlassUI.toc | sed 's/^## Version: *//' | tr -d '\r')
          echo "Version in the TOC: $version"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "not a release version: $version"; exit 1; fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already tagged: raise the version before releasing again"; exit 1
          fi
          for f in FantasyGlassUI_Options/FantasyGlassUI_Options.toc FantasyGlassUI_Locales/FantasyGlassUI_Locales.toc; do
            grep -q "^## Version: $version" "$f" || { echo "$f does not say $version"; exit 1; }
          done
          grep -q "^ns.version = \"$version\"" FantasyGlassUI/Core.lua || { echo "Core.lua does not say $version"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "refs/tags/$version"

      - name: Build and upload
        uses: BigWigsMods/packager@v2
        with:
          args: -n "Fantasy Glass UI {project-version}:FantasyGlassUI-{project-version}"
